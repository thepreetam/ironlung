name: Distro Matrix

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  distro:
    strategy:
      fail-fast: false
      matrix:
        include:
          # centos7, ubuntu1804: glibc too old for Actions runner (Node needs 2.28+)
          - distro: ubuntu2004
            image: ubuntu:20.04
          - distro: ubuntu2204
            image: ubuntu:22.04
          - distro: debian11
            image: debian:11
          - distro: debian12
            image: debian:12
          - distro: rockylinux9
            image: rockylinux:9
          - distro: rhel9
            image: redhat/ubi9
          - distro: fedora40
            image: fedora:latest
          - distro: arch
            image: archlinux:latest
          - distro: alpine
            image: alpine:3.19

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    container:
      image: ${{ matrix.image }}
      options: --user root

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps
        run: sh scripts/ci-install-deps.sh ${{ matrix.distro }}

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "CARGO_HOME=$HOME/.cargo" >> $GITHUB_ENV
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Build IronLung
        run: |
          . $HOME/.cargo/env
          echo "WORKSPACE=$(pwd)" >> $GITHUB_ENV
          cargo build --release --features sandbox -p ironlung
          cargo build --release -p ironlung-sandbox

      - name: Smoke test
        run: |
          . $HOME/.cargo/env
          gcc -o victim victim.c
          LD_PRELOAD=$(pwd)/target/release/libironlung.so ./victim

      - name: Sandbox test
        run: |
          . $HOME/.cargo/env
          export PATH="$HOME/.cargo/bin:$PATH"
          sh scripts/test_sandbox.sh
        continue-on-error: true  # best-effort in CI; run scripts/test_sandbox.sh locally for getaddrinfo validation

      - name: ABI check
        if: matrix.distro != 'alpine'
        run: |
          . $HOME/.cargo/env
          cargo build --release --features sandbox -p ironlung
          SO="$WORKSPACE/target/release/libironlung.so"
          if [ ! -f "$SO" ]; then echo "error: $SO not found"; ls -la "$WORKSPACE/target/release/" 2>/dev/null || true; exit 1; fi
          echo "--- dynamic symbols (printf/fprintf/vprintf) ---"
          nm -D -g "$SO" 2>/dev/null | grep -E '\s(printf|fprintf|vprintf)(@|$)' || true
          cargo run -p ironlung-abi-check -- "$SO"

      - name: I/O benchmark
        run: |
          . $HOME/.cargo/env
          gcc -O2 -o io_bench tests/io_bench.c
          echo "baseline:" && ./io_bench 10000 4096 2>&1 | tail -1
          echo "ironlung:" && LD_PRELOAD=$(pwd)/target/release/libironlung.so ./io_bench 10000 4096 2>&1 | tail -1
        continue-on-error: true

      - name: Alloc benchmark
        run: |
          . $HOME/.cargo/env
          gcc -O2 -lpthread -o alloc_bench tests/alloc_bench.c
          echo "baseline:" && ./alloc_bench 10000 4 2>&1 | tail -1
          echo "ironlung:" && LD_PRELOAD=$(pwd)/target/release/libironlung.so ./alloc_bench 10000 4 2>&1 | tail -1
        continue-on-error: true

      - name: App matrix
        if: matrix.distro != 'alpine'
        run: |
          . $HOME/.cargo/env
          sh scripts/run_app_matrix.sh

  fuzz:
    name: Doppelgänger fuzz
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "CARGO_HOME=$HOME/.cargo" >> $GITHUB_ENV
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Build IronLung
        run: |
          . $HOME/.cargo/env
          cargo build --release -p ironlung

      - name: Fuzz (doppelganger)
        run: |
          . $HOME/.cargo/env
          python3 scripts/doppelganger_fuzz.py
        continue-on-error: true
