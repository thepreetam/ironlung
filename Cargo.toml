[workspace]
members = [".", "crates/ironlung-protocol", "crates/ironlung-sandbox", "crates/ironlung-abi-check"]

[package]
name = "ironlung"
version = "0.1.0"
edition = "2021"

[features]
default = ["stdio-kernel", "stdio-kernel-fread-fwrite"]
sandbox = []
alloc-cache = []
alloc-quarantine = []   # delay reuse of freed blocks (UAF mitigation); FIFO, cap by count and bytes
stdio-kernel = []           # kernel-delegating vprintf (no-op on non-Linux)
stdio-kernel-fread-fwrite = []  # fread/fwrite via fileno + read/write (no-op on non-Linux)
stdio-libc = []             # force delegate printf/fread/fwrite to libc (disables kernel path when set)
pthread-native = []         # Linux: pthread_create/join via clone3+futex (no libc); mutex/cond still delegated

[lib]
crate-type = ["cdylib", "rlib"]

[profile.dev]
panic = "abort"

[profile.release]
lto = true
panic = "abort"
strip = true
opt-level = "z"

[build-dependencies]
cc = "1.0"

[dependencies]
sc = "0.2"
talc = { version = "4.4", default-features = false, features = ["lock_api"] }
libc = { version = "0.2", default-features = false }
spin = "0.9"
ironlung-protocol = { path = "crates/ironlung-protocol" }
