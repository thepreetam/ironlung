[workspace]
members = [".", "crates/ironlung-protocol", "crates/ironlung-sandbox", "crates/ironlung-abi-check"]

[package]
name = "ironlung"
version = "1.0.0"
edition = "2021"

[features]
default = ["alloc-tls-cache"]
alloc-cache = []        # Legacy C-based thread-local cache (deprecated)
alloc-tls-cache = []    # Rust-based thread-local slab cache (recommended)
alloc-quarantine = []   # delay reuse of freed blocks (UAF mitigation); FIFO, cap by count and bytes
alloc-mimalloc = []     # use mimalloc as backend allocator (high scalability)
hosted-test = ["std"]       # Enable std for hosted testing

[lib]
crate-type = ["cdylib", "rlib"]

[profile.dev]
panic = "abort"

[profile.release]
lto = true
panic = "abort"
strip = true
opt-level = "z"

[build-dependencies]
cc = "1.0"

[dependencies]
sc = "0.2"
talc = { version = "4.4", default-features = false, features = ["lock_api"] }
libc = { version = "0.2", default-features = false }
spin = "0.9"
ironlung-protocol = { path = "crates/ironlung-protocol" }
mimalloc = { version = "0.1", optional = true }
